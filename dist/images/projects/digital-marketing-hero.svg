<svg xmlns="http://www.w3.org/2000/svg" viewBox="700 90 900 770" role="img" aria-label="Floating analytics dashboard with blue growth charts, SEO panel, social engagement card and campaign widget" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FD"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <radialGradient id="amb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14306B"/>
      <stop offset="1" stop-color="#0B1F45"/>
    </linearGradient>
    <linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FB0FF"/>
      <stop offset="1" stop-color="#4C86F5"/>
    </linearGradient>
    <linearGradient id="blueFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B7BF2"/>
      <stop offset="1" stop-color="#1D4FD0"/>
    </linearGradient>
    <linearGradient id="blueSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E55D8"/>
      <stop offset="1" stop-color="#123A9E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#EAF2FF" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#0B1F45" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0B1F45" flood-opacity="0.2"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- Background (left side stays empty for headline text) -->
    <ellipse cx="1130" cy="440" rx="560" ry="400" fill="url(#amb)"/>
  <ellipse cx="1150" cy="810" rx="430" ry="38" fill="#0B1F45" opacity="0.18" filter="url(#blur30)"/>

  <!-- Floating geometry -->
  <g filter="url(#softShadow)">
    <circle cx="1470" cy="330" r="26" fill="url(#blueTop)"/>
    <circle cx="1462" cy="322" r="8" fill="#fff" opacity="0.6"/>
    <circle cx="745" cy="360" r="16" fill="url(#navy)"/>
    <g transform="translate(1500 560) rotate(18)">
      <rect width="46" height="46" rx="10" fill="url(#blueFront)"/>
      <rect x="6" y="6" width="34" height="12" rx="6" fill="#fff" opacity="0.25"/>
    </g>
    <g transform="translate(810 150) rotate(-14)">
      <rect width="34" height="34" rx="8" fill="url(#navy)"/>
    </g>
  </g>

  <!-- MAIN DASHBOARD -->
  <g transform="translate(830 175) rotate(-3)">
    <!-- thickness -->
    <rect x="10" y="16" width="640" height="420" rx="26" fill="#0B1F45"/>
    <g filter="url(#shadow)">
      <rect width="640" height="420" rx="26" fill="#FFFFFF"/>
    </g>
    <!-- sidebar -->
    <path d="M26 0H92V420H26A26 26 0 0 1 0 394V26A26 26 0 0 1 26 0Z" fill="url(#navy)"/>
    <circle cx="46" cy="40" r="14" fill="#2563EB"/>
    <rect x="22" y="90" width="48" height="10" rx="5" fill="#fff" opacity="0.85"/>
    <rect x="22" y="122" width="40" height="10" rx="5" fill="#fff" opacity="0.35"/>
    <rect x="22" y="154" width="44" height="10" rx="5" fill="#fff" opacity="0.35"/>
    <rect x="22" y="186" width="36" height="10" rx="5" fill="#fff" opacity="0.35"/>
    <!-- header -->
    <rect x="116" y="24" width="190" height="26" rx="13" fill="#EAF2FF"/>
    <circle cx="130" cy="37" r="6" fill="#2563EB"/>
    <circle cx="590" cy="37" r="14" fill="#EAF2FF"/>
    <circle cx="560" cy="37" r="14" fill="#EAF2FF"/>
    <!-- stat tiles -->
    <rect x="116" y="74" width="140" height="64" rx="14" fill="#F7F9FD" stroke="#DCE8FF"/>
    <rect x="132" y="90" width="50" height="8" rx="4" fill="#94A3B8" opacity="0.6"/>
    <rect x="132" y="108" width="84" height="16" rx="6" fill="#0B1F45"/>
    <rect x="272" y="74" width="140" height="64" rx="14" fill="#F7F9FD" stroke="#DCE8FF"/>
    <rect x="288" y="90" width="50" height="8" rx="4" fill="#94A3B8" opacity="0.6"/>
    <rect x="288" y="108" width="70" height="16" rx="6" fill="#2563EB"/>
    <rect x="428" y="74" width="190" height="64" rx="14" fill="url(#navy)"/>
    <rect x="446" y="90" width="60" height="8" rx="4" fill="#fff" opacity="0.5"/>
    <rect x="446" y="108" width="96" height="16" rx="6" fill="#fff"/>
    <path d="M560 122l14-14 10 8 22-22" stroke="#7FB0FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- chart panel -->
    <rect x="116" y="158" width="502" height="244" rx="16" fill="#F7F9FD" stroke="#DCE8FF"/>
    <g stroke="#DCE8FF" stroke-width="1.5">
      <path d="M140 230H600M140 285H600M140 340H600"/>
    </g>
    <!-- isometric bars: front, side, top -->
    <g>
      <!-- bar 1 -->
      <polygon points="170,380 206,380 206,330 170,330" fill="url(#blueFront)"/>
      <polygon points="206,380 220,372 220,322 206,330" fill="url(#blueSide)"/>
      <polygon points="170,330 184,322 220,322 206,330" fill="url(#blueTop)"/>
      <!-- bar 2 -->
      <polygon points="240,380 276,380 276,298 240,298" fill="url(#blueFront)"/>
      <polygon points="276,380 290,372 290,290 276,298" fill="url(#blueSide)"/>
      <polygon points="240,298 254,290 290,290 276,298" fill="url(#blueTop)"/>
      <!-- bar 3 -->
      <polygon points="310,380 346,380 346,314 310,314" fill="url(#blueFront)"/>
      <polygon points="346,380 360,372 360,306 346,314" fill="url(#blueSide)"/>
      <polygon points="310,314 324,306 360,306 346,314" fill="url(#blueTop)"/>
      <!-- bar 4 -->
      <polygon points="380,380 416,380 416,262 380,262" fill="url(#blueFront)"/>
      <polygon points="416,380 430,372 430,254 416,262" fill="url(#blueSide)"/>
      <polygon points="380,262 394,254 430,254 416,262" fill="url(#blueTop)"/>
      <!-- bar 5 -->
      <polygon points="450,380 486,380 486,226 450,226" fill="url(#blueFront)"/>
      <polygon points="486,380 500,372 500,218 486,226" fill="url(#blueSide)"/>
      <polygon points="450,226 464,218 500,218 486,226" fill="url(#blueTop)"/>
    </g>
    <!-- glowing growth line -->
    <path d="M150 340 C200 320 230 330 280 290 S380 250 430 215 S520 190 585 182" fill="none" stroke="#2563EB" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M150 340 C200 320 230 330 280 290 S380 250 430 215 S520 190 585 182" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="585" cy="182" r="11" fill="#fff" stroke="#2563EB" stroke-width="5"/>
    <path d="M572 168l16-2-2 16" fill="none" stroke="#2563EB" stroke-width="0"/>
  </g>

  <!-- SOCIAL ENGAGEMENT CARD -->
  <g transform="translate(1310 120) rotate(5)" filter="url(#softShadow)">
    <rect width="250" height="150" rx="22" fill="url(#glass)" stroke="#fff" stroke-opacity="0.9"/>
    <circle cx="42" cy="42" r="20" fill="url(#blueFront)"/>
    <circle cx="42" cy="36" r="7" fill="#fff" opacity="0.9"/>
    <path d="M28 54a14 11 0 0 1 28 0" fill="#fff" opacity="0.9"/>
    <rect x="76" y="30" width="90" height="10" rx="5" fill="#0B1F45"/>
    <rect x="76" y="48" width="60" height="8" rx="4" fill="#94A3B8" opacity="0.6"/>
    <rect x="24" y="82" width="202" height="10" rx="5" fill="#CBDBF7"/>
    <rect x="24" y="100" width="140" height="10" rx="5" fill="#CBDBF7"/>
    <g transform="translate(24 120)">
      <path d="M10 18C-6 6 2-6 10 2c8-8 16 4 0 16z" fill="#2563EB"/>
      <rect x="32" y="3" width="36" height="9" rx="4.5" fill="#2563EB" opacity="0.55"/>
      <circle cx="104" cy="9" r="8" fill="#0B1F45" opacity="0.85"/>
      <rect x="120" y="3" width="36" height="9" rx="4.5" fill="#0B1F45" opacity="0.4"/>
    </g>
  </g>

  <!-- SEO SEARCH PANEL -->
  <g transform="translate(740 615) rotate(-4)" filter="url(#softShadow)">
    <rect width="400" height="150" rx="22" fill="url(#glass)" stroke="#fff" stroke-opacity="0.9"/>
    <rect x="24" y="22" width="352" height="38" rx="19" fill="#fff" stroke="#DCE8FF"/>
    <circle cx="48" cy="41" r="8" fill="none" stroke="#2563EB" stroke-width="3"/>
    <path d="M54 47l8 8" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <rect x="76" y="36" width="130" height="10" rx="5" fill="#94A3B8" opacity="0.5"/>
    <rect x="24" y="76" width="30" height="30" rx="8" fill="url(#blueFront)"/>
    <rect x="66" y="78" width="200" height="9" rx="4.5" fill="#2563EB"/>
    <rect x="66" y="96" width="290" height="8" rx="4" fill="#CBDBF7"/>
    <rect x="24" y="116" width="30" height="18" rx="6" fill="#0B1F45" opacity="0.85"/>
    <rect x="66" y="120" width="230" height="8" rx="4" fill="#CBDBF7"/>
  </g>

  <!-- CAMPAIGN PERFORMANCE WIDGET -->
  <g transform="translate(1260 585) rotate(4)" filter="url(#softShadow)">
    <rect width="270" height="170" rx="22" fill="url(#navy)"/>
    <rect x="1" y="1" width="268" height="168" rx="21" fill="none" stroke="#fff" stroke-opacity="0.18"/>
    <circle cx="78" cy="86" r="42" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="12"/>
    <circle cx="78" cy="86" r="42" fill="none" stroke="#60A5FA" stroke-width="12" stroke-linecap="round" stroke-dasharray="190 264" transform="rotate(-90 78 86)" filter="url(#glow)"/>
    <rect x="62" y="80" width="32" height="12" rx="6" fill="#fff"/>
    <rect x="146" y="46" width="90" height="10" rx="5" fill="#fff" opacity="0.8"/>
    <rect x="146" y="68" width="60" height="8" rx="4" fill="#fff" opacity="0.35"/>
    <g fill="#60A5FA">
      <rect x="146" y="120" width="16" height="22" rx="4"/>
      <rect x="170" y="108" width="16" height="34" rx="4"/>
      <rect x="194" y="96" width="16" height="46" rx="4"/>
      <rect x="218" y="82" width="16" height="60" rx="4" fill="#fff"/>
    </g>
  </g>
</svg>
